apis:
  - aid: locofy:lightning
    name: Locofy Lightning
    description: >-
      Figma and Adobe XD plugin that tags layers, applies responsive behavior,
      and exports production-ready front-end code (React, Next.js, HTML/CSS,
      React Native, Gatsby). Acts as the primary entry point into the Locofy
      workflow from inside the design tool.
    humanURL: https://www.locofy.ai/lightning
    baseURL: https://www.locofy.ai/lightning
    tags:
      - Figma Plugin
      - Adobe XD Plugin
      - Code Export
    properties:
      - type: Website
        url: https://www.locofy.ai/lightning
  - aid: locofy:builder
    name: Locofy Builder
    description: >-
      Web-based workspace for refining AI-generated components and screens,
      wiring data and interactivity, and exporting or syncing code to a Git
      repository. Sits downstream of Lightning in the design-to-code flow.
    humanURL: https://builder.locofy.ai/
    baseURL: https://builder.locofy.ai/
    tags:
      - Builder
      - Web App
      - Code Sync
    properties:
      - type: Website
        url: https://builder.locofy.ai/
  - aid: locofy:ai
    name: Locofy AI
    description: >-
      AI layer that powers automatic tagging, responsive layout suggestions,
      component detection, and code generation across Lightning and Builder.
      Exposed through the products rather than a standalone public API.
    humanURL: https://www.locofy.ai/
    baseURL: https://www.locofy.ai/
    tags:
      - AI
      - Code Generation
    properties:
      - type: Website
        url: https://www.locofy.ai/
