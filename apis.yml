aid: locofy
url: https://raw.githubusercontent.com/api-evangelist/locofy/refs/heads/main/apis.yml
name: Locofy
kind: company
description: >-
  Locofy.ai is an AI-assisted design-to-code platform that converts Figma and
  Adobe XD designs into production-ready front-end code. The flagship product
  Locofy Lightning is a Figma/Adobe XD plugin that tags designs and exports
  responsive code; Locofy Builder is a web-based workspace for refining the
  generated app, wiring data, and shipping to repositories. Output targets
  include React, Next.js, React Native, HTML/CSS, and Gatsby. The platform is
  primarily delivered as plugins and a web app rather than a public REST API.
